name: Lockfile bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.repository == 'Daarxsn/Fx-Financial'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact locked dependencies
        run: npm ci --no-audit
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: ci_placeholder
          DATABASE_USER: ci_placeholder
          DATABASE_PASSWORD: ci_placeholder
          DATABASE_SSL: "true"
          SESSION_SECRET: "ci-only-session-secret-value-not-for-production-000000"
      - name: Commit lockfile if it changed
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit reproducible npm lockfile"
          git push origin HEAD:main
