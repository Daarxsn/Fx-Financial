name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: falchion_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks scans the commit range from the merge base, so it needs history.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Secret scan (repository history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: MySQL 8 migration, seed, failure-safety and restore integration
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: falchion_ci
          DATABASE_USER: root
          DATABASE_PASSWORD: ci_root_password
          DATABASE_SSL: "false"
          MYSQL_ROOT_PASSWORD: ci_root_password
        run: |
          set -euo pipefail
          npm run db:migrate
          npm run db:migrate
          npm run db:seed:reference
          npm run db:seed:reference

          # Verify migration ledger and repeatable seed counts without dumping row contents.
          node -e 'const mysql=require("mysql2/promise"); (async()=>{const c=await mysql.createConnection({host:process.env.DATABASE_HOST,port:Number(process.env.DATABASE_PORT),database:process.env.DATABASE_NAME,user:process.env.DATABASE_USER,password:process.env.DATABASE_PASSWORD}); const [[migrations],[permissions],[roles],[roleMappings]]=await Promise.all([c.query("SELECT COUNT(*) AS n FROM schema_migrations"),c.query("SELECT COUNT(*) AS n FROM app_permissions"),c.query("SELECT COUNT(*) AS n FROM app_roles"),c.query("SELECT COUNT(*) AS n FROM role_permissions")]); if(Number(migrations[0].n)!==27 || Number(permissions[0].n)!==27 || Number(roles[0].n)!==7 || Number(roleMappings[0].n)!==86) { await c.end(); process.exit(1) }; console.log("PASS: 27 migration records, 27 permission definitions, 7 role definitions and 86 role-permission mappings."); await c.end()})().catch(()=>process.exit(1))'

          # Negative network-path test: the verifier must fail without exposing raw diagnostics.
          if DATABASE_PORT=1 DATABASE_SSL=true npm run db:verify > "$RUNNER_TEMP/db-negative-test.log" 2>&1; then
            echo "Expected database verification to fail on the deliberately closed port."
            exit 1
          fi
          if grep -E 'ci_root_password|127\.0\.0\.1|ECONNREFUSED|Access denied for user' "$RUNNER_TEMP/db-negative-test.log"; then
            echo "Negative connection test exposed database diagnostics."
            exit 1
          fi

          # Restore a logical dump into an isolated database and compare base-table counts.
          if ! command -v mysqldump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mysql-client
          fi
          client_config="$RUNNER_TEMP/mysql-client.cnf"
          printf '[client]\nhost=127.0.0.1\nport=3306\nuser=root\npassword=%s\n' "$MYSQL_ROOT_PASSWORD" > "$client_config"
          chmod 600 "$client_config"
          mysqldump --defaults-extra-file="$client_config" --single-transaction --routines --triggers --events falchion_ci > "$RUNNER_TEMP/falchion-ci.sql"
          test -s "$RUNNER_TEMP/falchion-ci.sql"
          mysql --defaults-extra-file="$client_config" -e 'CREATE DATABASE falchion_ci_restore'
          mysql --defaults-extra-file="$client_config" falchion_ci_restore < "$RUNNER_TEMP/falchion-ci.sql"
          source_tables="$(mysql --defaults-extra-file="$client_config" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='falchion_ci' AND table_type='BASE TABLE'")"
          restored_tables="$(mysql --defaults-extra-file="$client_config" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='falchion_ci_restore' AND table_type='BASE TABLE'")"
          restored_migrations="$(mysql --defaults-extra-file="$client_config" falchion_ci_restore -Nse 'SELECT COUNT(*) FROM schema_migrations')"
          test "$source_tables" -gt 0
          test "$source_tables" = "$restored_tables"
          test "$restored_migrations" = "27"
          echo "PASS: 27 MySQL 8 migrations/idempotency, repeated reference seed, safe failure behavior and logical dump/restore verified."

      - name: Verify health endpoint success and safe failure responses
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: falchion_ci
          DATABASE_USER: root
          DATABASE_PASSWORD: ci_root_password
          DATABASE_SSL: "false"
        run: |
          set -euo pipefail
          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/next-health-ok.log" 2>&1 &
          healthy_pid=$!
          trap 'kill "$healthy_pid" 2>/dev/null || true' EXIT
          healthy_code=""
          for attempt in $(seq 1 30); do
            healthy_code="$(curl -sS -o "$RUNNER_TEMP/health-ok.json" -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            if [ "$healthy_code" = "200" ]; then break; fi
            sleep 2
          done
          test "$healthy_code" = "200"
          node -e 'const h=JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/health-ok.json","utf8")); if(h.status!=="ok" || h.checks?.database!=="ok") process.exit(1); console.log("PASS: health endpoint returns 200 for a reachable database.")'
          kill "$healthy_pid" 2>/dev/null || true
          wait "$healthy_pid" 2>/dev/null || true
          trap - EXIT

          DATABASE_PORT=1 ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/next-health-fail.log" 2>&1 &
          failing_pid=$!
          trap 'kill "$failing_pid" 2>/dev/null || true' EXIT
          failing_code=""
          for attempt in $(seq 1 30); do
            failing_code="$(curl -sS -o "$RUNNER_TEMP/health-fail.json" -w '%{http_code}' http://127.0.0.1:3001/api/health || true)"
            if [ "$failing_code" = "503" ]; then break; fi
            sleep 2
          done
          test "$failing_code" = "503"
          node -e 'const h=JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/health-fail.json","utf8")); if(h.status!=="degraded" || h.checks?.database!=="error" || JSON.stringify(h).match(/ECONNREFUSED|127\\.0\\.0\\.1|ci_root_password/)) process.exit(1); console.log("PASS: unavailable database returns a generic 503 without raw diagnostics.")'
          kill "$failing_pid" 2>/dev/null || true
          wait "$failing_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate OpenAPI contract
        run: npm run api:validate
      - name: Verify Pack 6 email and reminder invariants
        run: npm run email:contract-test
      - name: Verify authentication, authorization and master-data API contracts
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: falchion_ci
          DATABASE_USER: root
          DATABASE_PASSWORD: ci_root_password
          DATABASE_SSL: "false"
          SESSION_SECRET: "ci-only-session-secret-value-not-for-production-000000"
          API_TEST_BASE_URL: http://127.0.0.1:3002
          RESEND_API_URL: http://127.0.0.1:3030
          RESEND_API_KEY: ci-resend-test-key
          RESEND_FROM_EMAIL: "Falchion CI <billing@example.invalid>"
          RESEND_WEBHOOK_SECRET: "Y2ktZW1haWwtd2ViaG9vay1zZWNyZXQ="
          CRON_SECRET: "ci-pack6-cron-secret-long-enough-000000000000"
        run: |
          set -euo pipefail
          node scripts/mock-resend-server.mjs > "$RUNNER_TEMP/mock-resend.log" 2>&1 &
          provider_pid=$!
          provider_ready="false"
          for attempt in $(seq 1 15); do
            provider_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3030/health || true)"
            if [ "$provider_status" = "200" ]; then provider_ready="true"; break; fi
            sleep 1
          done
          test "$provider_ready" = "true"
          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3002 > "$RUNNER_TEMP/next-api-contract.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$provider_pid" 2>/dev/null || true' EXIT
          ready="false"
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/api/v1/customers || true)"
            if [ "$status" = "401" ]; then ready="true"; break; fi
            sleep 2
          done
          test "$ready" = "true"
          if ! npm run auth:security-test; then
            cat "$RUNNER_TEMP/next-api-contract.log"
            cat "$RUNNER_TEMP/mock-resend.log"
            exit 1
          fi
          kill "$server_pid" "$provider_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          wait "$provider_pid" 2>/dev/null || true
          trap - EXIT
      - name: Verify Phase 6B numbering and immutable configuration snapshots
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: falchion_ci
          DATABASE_USER: root
          DATABASE_PASSWORD: ci_root_password
          DATABASE_SSL: "false"
        run: NODE_OPTIONS=--conditions=react-server npm run config:phase6b-test
      - name: Verify invoice calculation engine accuracy and rounding policy
        run: npm run finance:calculation-test
      - name: Verify PDF rendering, pagination and private storage integrity
        run: npm run documents:unit-test
      - name: Validate responsive and accessibility UI foundation
        run: npm run ui:validate
      - name: Validate Phase 7 customer/catalog UI foundation
        run: npm run phase7:ui-test
      - name: Validate invoice/quotation access and onboarding UX
        run: npm run invoice:access-ui-test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: ci_placeholder
          DATABASE_USER: ci_placeholder
          DATABASE_PASSWORD: ci_placeholder
          DATABASE_SSL: "true"
          SESSION_SECRET: "ci-only-session-secret-value-not-for-production-000000"

      - name: Install Playwright Chromium for Phase 7 browser acceptance
        run: |
          npm install --no-save --no-audit playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Run Phase 7 browser acceptance against disposable MySQL
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: falchion_ci
          DATABASE_USER: root
          DATABASE_PASSWORD: ci_root_password
          DATABASE_SSL: "false"
          SESSION_SECRET: "ci-only-session-secret-value-not-for-production-000000"
          PHASE7_BROWSER_BASE_URL: http://127.0.0.1:3003
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase7-browser"
          setsid ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3003 > "$RUNNER_TEMP/phase7-browser/next.log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill -- "-$server_pid" 2>/dev/null || kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          ready="false"
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o "$RUNNER_TEMP/phase7-browser/health.json" -w '%{http_code}' http://127.0.0.1:3003/api/health || true)"
            if [ "$status" = "200" ]; then ready="true"; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat "$RUNNER_TEMP/phase7-browser/next.log"
            exit 1
          fi
          if npm run phase7:browser-test; then
            true
          else
            echo "===== Next.js server log (browser test failed) ====="
            cat "$RUNNER_TEMP/phase7-browser/next.log"
            exit 1
          fi
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-browser-diagnostics
          path: ${{ runner.temp }}/phase7-browser/
          if-no-files-found: ignore
          retention-days: 7
