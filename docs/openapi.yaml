openapi: 3.1.0
info:
  title: Falchion Xeniaa Invoice Management API
  version: 1.0.0
  description: >
    Canonical v1 API contract. Operations are explicitly marked implemented or planned with
    x-implementation-status. Planned operations are not live unless a matching route and tests exist.
    Protected operations use the fx_session HttpOnly cookie established by the configured identity flow.
servers:
  - url: /
    description: Same-origin application API
tags:
  - name: Health
  - name: Customers
  - name: Catalog
  - name: Legal Entities
  - name: Brands
  - name: Tax
  - name: Quotations
  - name: Invoices
  - name: Payments
  - name: Approvals
  - name: Documents
  - name: Communications
  - name: Reports
  - name: Audit
  - name: Authentication
  - name: Users
security:
  - cookieAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Root health/readiness endpoint
      operationId: getRootHealth
      x-implementation-status: implemented
      security: []
      responses:
        "200":
          description: Application and database are responding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Required database dependency unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/v1/health:
    get:
      tags: [Health]
      summary: Versioned health/readiness endpoint
      operationId: getVersionedHealth
      x-implementation-status: implemented
      security: []
      responses:
        "200":
          description: Application and database are responding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Required database dependency unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: Search and list customers
      operationId: listCustomers
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - in: query
          name: status
          schema: { type: string, enum: [active, archived, all], default: active }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      summary: Create a customer master record
      operationId: createCustomer
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/customers/{customerId}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
    get:
      tags: [Customers]
      summary: Retrieve a customer
      operationId: getCustomer
      x-implementation-status: implemented
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Customers]
      summary: Update an editable customer master record
      operationId: updateCustomer
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdateInput" }
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/customers/{customerId}/archive:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
    post:
      tags: [Customers]
      summary: Archive a customer without deleting historical references
      operationId: archiveCustomer
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveInput" }
      responses:
        "200":
          description: Customer archived and historical references preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/customers/export:
    get:
      tags: [Customers]
      summary: Export a bounded customer CSV using caller-authorized fields
      operationId: exportCustomersCsv
      x-implementation-status: implemented
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, archived, all], default: active }
      responses:
        "200":
          description: UTF-8 CSV attachment
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Conflict" }
  /api/v1/customers/import:
    post:
      tags: [Customers]
      summary: Validate or atomically commit a bounded customer CSV
      operationId: importCustomersCsv
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
        - in: query
          name: mode
          schema: { type: string, enum: [validate, commit], default: validate }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 1000000 }
      responses:
        "200":
          description: CSV validated without writes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMeta" }
        "201":
          description: Validated CSV committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/items:
    get:
      tags: [Catalog]
      summary: Search and list catalog items
      operationId: listCatalogItems
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - in: query
          name: status
          schema: { type: string, enum: [active, archived, all], default: active }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Catalog item page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      summary: Create a catalog item
      operationId: createCatalogItem
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemInput" }
      responses:
        "201":
          description: Catalog item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ItemId" }
    get:
      tags: [Catalog]
      summary: Retrieve a catalog item
      operationId: getCatalogItem
      x-implementation-status: implemented
      responses:
        "200":
          description: Catalog item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      summary: Update catalog master data
      operationId: updateCatalogItem
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemUpdateInput" }
      responses:
        "200":
          description: Catalog item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/items/{itemId}/archive:
    parameters:
      - { $ref: "#/components/parameters/ItemId" }
    post:
      tags: [Catalog]
      summary: Archive an item/service without deleting historical references
      operationId: archiveCatalogItem
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveInput" }
      responses:
        "200":
          description: Catalog item archived and historical references preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/catalog/items/export:
    get:
      tags: [Catalog]
      summary: Export a bounded item/service CSV using caller-authorized fields
      operationId: exportCatalogItemsCsv
      x-implementation-status: implemented
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, archived, all], default: active }
      responses:
        "200":
          description: UTF-8 CSV attachment
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Conflict" }
  /api/v1/catalog/items/import:
    post:
      tags: [Catalog]
      summary: Validate or atomically commit a bounded item/service CSV
      operationId: importCatalogItemsCsv
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
        - in: query
          name: mode
          schema: { type: string, enum: [validate, commit], default: validate }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 1000000 }
      responses:
        "200":
          description: CSV validated without writes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMeta" }
        "201":
          description: Validated CSV committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/legal-entities:
    get:
      tags: [Legal Entities]
      summary: List legal billing entities in the caller's permitted scope
      operationId: listLegalEntities
      x-implementation-status: implemented
      responses:
        "200":
          description: Legal entity list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntityListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Legal Entities]
      summary: Create a draft legal entity configuration
      operationId: createLegalEntity
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalEntityInput" }
      responses:
        "201":
          description: Draft legal entity configuration created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/legal-entities/{legalEntityId}:
    parameters:
      - { $ref: "#/components/parameters/LegalEntityId" }
    get:
      tags: [Legal Entities]
      summary: Get a legal entity configuration
      operationId: getLegalEntity
      x-implementation-status: implemented
      responses:
        "200":
          description: Legal entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Legal Entities]
      summary: Update a non-issued effective-dated configuration
      operationId: updateLegalEntity
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalEntityUpdateInput" }
      responses:
        "200":
          description: Legal entity configuration version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntityResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/brands:
    get:
      tags: [Brands]
      summary: List brand labels
      operationId: listBrands
      x-implementation-status: implemented
      responses:
        "200":
          description: Brand list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Brands]
      summary: Create a brand label
      operationId: createBrand
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandInput" }
      responses:
        "201":
          description: Brand created; legal entity mapping is not inferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/brands/{brandId}:
    parameters:
      - { $ref: "#/components/parameters/BrandId" }
    get:
      tags: [Brands]
      summary: Retrieve one brand and its in-scope effective entity mappings
      operationId: getBrandConfiguration
      x-implementation-status: implemented
      responses:
        "200":
          description: Brand configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Brands]
      summary: Update a brand and preserve mapping history
      operationId: updateBrandConfiguration
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandUpdateInput" }
      responses:
        "200":
          description: Brand configuration version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/brands/{brandId}/legal-entities:
    parameters:
      - { $ref: "#/components/parameters/BrandId" }
    get:
      tags: [Brands]
      summary: List approved effective mappings for a brand
      operationId: listBrandLegalEntityMappings
      x-implementation-status: planned
      responses:
        "200":
          description: Effective-dated mapping list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandEntityMappingListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Brands]
      summary: Request an explicitly approved brand/entity mapping
      operationId: createBrandLegalEntityMapping
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandEntityMappingInput" }
      responses:
        "201":
          description: Mapping record created with approval/effective-date policy applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandEntityMappingResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/legal-entities/{legalEntityId}/readiness:
    parameters:
      - { $ref: "#/components/parameters/LegalEntityId" }
    get:
      tags: [Legal Entities]
      summary: Check scoped legal entity configuration readiness
      operationId: getLegalEntityReadiness
      x-implementation-status: implemented
      responses:
        "200":
          description: Readiness checklist; passing it does not issue an invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalEntityReadinessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/business-units:
    get:
      tags: [Brands]
      summary: List business units visible in the caller's legal-entity scope
      operationId: listBusinessUnits
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/Query" }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive, all], default: active }
      responses:
        "200":
          description: Scoped business unit list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnitListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Brands]
      summary: Create a business unit with explicit entity and brand mappings
      operationId: createBusinessUnit
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessUnitInput" }
      responses:
        "201":
          description: Business unit and initial configuration version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnitResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/business-units/{businessUnitId}:
    parameters:
      - in: path
        name: businessUnitId
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [Brands]
      summary: Retrieve a business unit inside the caller's scope
      operationId: getBusinessUnit
      x-implementation-status: implemented
      responses:
        "200":
          description: Business unit and configuration history metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnitResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Brands]
      summary: Update a business unit and preserve effective-dated mapping history
      operationId: updateBusinessUnit
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessUnitUpdateInput" }
      responses:
        "200":
          description: Business unit configuration version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessUnitResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/legal-entities/{legalEntityId}/tax-rules:
    parameters:
      - { $ref: "#/components/parameters/LegalEntityId" }
    get:
      tags: [Tax]
      summary: List effective-dated tax rules for an entity
      operationId: listTaxRules
      x-implementation-status: planned
      responses:
        "200":
          description: Tax rule list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRuleListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tax]
      summary: Propose a tax rule for approval
      operationId: createTaxRule
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRuleInput" }
      responses:
        "201":
          description: Rule created with pending/approved state per configured workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRuleResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/invoices:
    get:
