            application/json:
              schema: { $ref: "#/components/schemas/EmailOutboxResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/documents/{fileId}:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    get:
      tags: [Documents]
      summary: Read/download a private document artifact
      operationId: downloadDocument
      x-implementation-status: planned
      responses:
        "200":
          description: Artifact bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/reminders:
    get:
      tags: [Communications]
      summary: List scheduled reminder jobs
      operationId: listReminders
      x-implementation-status: planned
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [SCHEDULED, PROCESSING, SENT, SKIPPED, FAILED, CANCELLED] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Reminder job page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/reports/receivables:
    get:
      tags: [Reports]
      summary: Read scoped receivables report with separate invoice, receipt and balance totals
      operationId: getReceivablesReport
      x-implementation-status: planned
      parameters:
        - in: query
          name: legalEntityId
          schema: { $ref: "#/components/schemas/Uuid" }
        - in: query
          name: asOfDate
          schema: { type: string, format: date }
        - in: query
          name: customerId
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Receivables summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablesReportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/exports:
    post:
      tags: [Reports]
      summary: Queue a scoped audited data export
      operationId: createExport
      x-implementation-status: planned
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exportType, legalEntityIds, format]
              properties:
                exportType: { type: string, enum: [INVOICES, PAYMENTS, RECEIVABLES, CUSTOMERS, AUDIT] }
                legalEntityIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/Uuid" }
                format: { type: string, enum: [CSV, JSON] }
                filters: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Export queued; download remains private and time-limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/audit-events:
    get:
      tags: [Audit]
      summary: Search scoped audit history
      operationId: listAuditEvents
      x-implementation-status: planned
      parameters:
        - in: query
          name: entityType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: entityId
          schema: { $ref: "#/components/schemas/Uuid" }
        - in: query
          name: actorId
          schema: { $ref: "#/components/schemas/Uuid" }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Audit event page; secrets and sensitive payload fields are omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue a short-lived anonymous CSRF bootstrap cookie and token
      operationId: getCsrfToken
      x-implementation-status: implemented
      security: []
      responses:
        "200":
          description: Short-lived CSRF token; token value also appears in a host-only SameSite=Strict cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfResponse" }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Exchange email/password credentials for a revocable server-side session
      operationId: login
      x-implementation-status: implemented
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated user data; session token is set only in an HttpOnly cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Account or source rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session and clear authentication cookies
      operationId: logout
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: Session revoked; cookies cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the current session's live database-backed permissions and scope
      operationId: getCurrentUser
      x-implementation-status: implemented
      responses:
        "200":
          description: Current active user and session expiration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/activate:
    post:
      tags: [Authentication]
      summary: Activate an invited account using a single-use token and set a password
      operationId: activateAccount
      x-implementation-status: implemented
      security: []
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationInput" }
      responses:
        "200":
          description: Account activated; user must sign in separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Activation attempt rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/sessions/revoke-all:
    post:
      tags: [Authentication]
      summary: Revoke every active session for the current user
      operationId: revokeAllSessions
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: All sessions revoked and current cookies cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users and role assignment summaries for authorized administrators
      operationId: listUsers
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: User page; password hashes, invitation tokens and session tokens are never included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/invitations:
    post:
      tags: [Users]
      summary: Create an invitation and return its single-use token to an authorized caller once
      operationId: createUserInvitation
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInvitationInput" }
      responses:
        "201":
          description: Invitation created for out-of-band delivery; token is returned once and is never logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInvitationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Invitation creation rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    patch:
      tags: [Users]
      summary: Update account status, roles or legal-entity scopes and revoke existing sessions
      operationId: updateUserAccess
      x-implementation-status: implemented
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAccessUpdateInput" }
      responses:
        "200":
          description: Updated user access summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fx_session
      description: HttpOnly signed application session cookie; do not send bearer tokens or client-selected roles.
  parameters:
    Query:
      in: query
      name: query
      schema: { type: string, maxLength: 100 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Double-submit token matching the host-only fx_csrf cookie; state-changing requests also require same-origin Origin or Referer.
      schema: { type: string, minLength: 32, maxLength: 128 }
    CustomerId:
      in: path
      name: customerId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ItemId:
      in: path
      name: itemId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    LegalEntityId:
      in: path
      name: legalEntityId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BrandId:
      in: path
      name: brandId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    QuotationId:
      in: path
      name: quotationId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    UserId:
      in: path
      name: userId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    FileId:
      in: path
      name: fileId
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
  responses:
    BadRequest:
      description: Malformed JSON or query parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted or out of scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource missing or intentionally concealed outside caller scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State, duplicate idempotency or concurrency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Body fails schema or domain validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Uuid:
      type: string
      format: uuid
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$'
      description: Exact decimal string; all authoritative arithmetic uses decimal-safe server code and MySQL DECIMAL.
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        pagination:
          type: object
          required: [limit, offset, hasMore]
          properties:
            limit: { type: integer, minimum: 1, maximum: 100 }
            offset: { type: integer, minimum: 0, maximum: 1000000 }
            hasMore: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
            requestId: { type: string, format: uuid }
    SuccessMeta:
      type: object
      required: [meta]
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
    HealthResponse:
      type: object
      required: [status, checks, checkedAt]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, error] }
        checkedAt: { type: string, format: date-time }
    CustomerContactInput:
      type: object
      additionalProperties: false
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        jobTitle: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, maxLength: 50 }
        isPrimary: { type: boolean }
    CustomerTaxIdentifierInput:
      type: object
      additionalProperties: false
      required: [identifierType, identifierValue]
      properties:
        identifierType: { type: string, minLength: 1, maxLength: 40 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        jurisdiction: { type: string, maxLength: 120 }
        identifierValue: { type: string, minLength: 1, maxLength: 160 }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        customerCode: { type: string, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 255 }
        email:
          oneOf:
            - { type: string, format: email, minLength: 1, maxLength: 320 }
            - { type: string, const: "" }
        phone:
          oneOf:
            - { type: string, minLength: 1, maxLength: 50 }
            - { type: string, const: "" }
        billingAddress: { type: [object, "null"], additionalProperties: true }
        shippingAddress: { type: [object, "null"], additionalProperties: true }
        purchaseOrderReference: { type: string, maxLength: 160 }
        paymentTermsDays: { type: [integer, "null"], minimum: 0, maximum: 65535 }
        taxIdentifier: { type: string, maxLength: 100 }
        taxIdentifiers:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CustomerTaxIdentifierInput" }
        contacts:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CustomerContactInput" }
        notes: { type: string, maxLength: 5000 }
    CustomerUpdateInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        customerCode: { type: [string, "null"], maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, maxLength: 320 }
        phone: { type: string, maxLength: 50 }
        billingAddress: { type: [object, "null"], additionalProperties: true }
        shippingAddress: { type: [object, "null"], additionalProperties: true }
        purchaseOrderReference: { type: string, maxLength: 160 }
        paymentTermsDays: { type: [integer, "null"], minimum: 0, maximum: 65535 }
        taxIdentifier: { type: string, maxLength: 100 }
        taxIdentifiers:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CustomerTaxIdentifierInput" }
        contacts:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CustomerContactInput" }
        notes: { type: string, maxLength: 5000 }
    Customer:
      type: object
      required: [id, name, isActive, recordVersion]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        customerCode: { type: [string, "null"] }
        name: { type: string, maxLength: 255 }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        billingAddress: { type: [object, "null"], additionalProperties: true }
        shippingAddress: { type: [object, "null"], additionalProperties: true }
        purchaseOrderReference: { type: [string, "null"] }
        paymentTermsDays: { type: [integer, "null"] }
        taxIdentifier: { type: [string, "null"] }
        taxIdentifiers:
          type: array
          items: { $ref: "#/components/schemas/CustomerTaxIdentifierInput" }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContactInput" }
        notes: { type: [string, "null"] }
        isActive: { type: boolean }
        recordVersion: { type: integer, minimum: 1 }
        archivedAt: { type: [string, "null"], format: date-time }
        archiveReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        referenceCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    CustomerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/Meta" }
    CustomerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/Meta" }
    CatalogItemInput:
      type: object
      additionalProperties: false
      required: [itemType, name, customerDescription, unitCode, defaultUnitPrice, currency]
      properties:
        itemCode:
          oneOf:
            - { type: string, minLength: 1, maxLength: 80 }
            - { type: string, const: "" }
        itemType: { type: string, enum: [PRODUCT, SERVICE] }
        name: { type: string, minLength: 1, maxLength: 255 }
        customerDescription: { type: string, minLength: 1, maxLength: 1000 }
        internalDescription: { type: string, maxLength: 1000 }
        unitCode: { type: string, minLength: 1, maxLength: 40 }
        defaultUnitPrice: { type: string, pattern: '^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        defaultTaxCode:
          oneOf:
            - { type: string, minLength: 1, maxLength: 80 }
            - { type: string, const: "" }
    CatalogItemUpdateInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        itemCode: { type: string, maxLength: 80 }
        itemType: { type: string, enum: [PRODUCT, SERVICE] }
        name: { type: string, minLength: 1, maxLength: 255 }
        customerDescription: { type: string, minLength: 1, maxLength: 1000 }
        internalDescription: { type: string, maxLength: 1000 }
        unitCode: { type: string, minLength: 1, maxLength: 40 }
        defaultUnitPrice: { type: string, pattern: '^(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        defaultTaxCode: { type: string, maxLength: 80 }
    CatalogItem:
      type: object
      required: [id, itemType, name, customerDescription, unitCode, defaultUnitPrice, currency, isActive, recordVersion]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        itemCode: { type: [string, "null"] }
        itemType: { type: string, enum: [PRODUCT, SERVICE] }
        name: { type: string }
        customerDescription: { type: string }
        internalDescription: { type: [string, "null"] }
        unitCode: { type: string }
        defaultUnitPrice: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        defaultTaxCode: { type: [string, "null"] }
        isActive: { type: boolean }
        recordVersion: { type: integer, minimum: 1 }
        archivedAt: { type: [string, "null"], format: date-time }
        archiveReason: { type: [string, "null"] }
        referenceCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CatalogItemResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogItem" }
        meta: { $ref: "#/components/schemas/Meta" }
    CatalogItemListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        meta: { $ref: "#/components/schemas/Meta" }
    ArchiveInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ArchiveResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [id, isActive, recordVersion, archivedAt, referenceCounts, message]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            isActive: { type: boolean, const: false }
            recordVersion: { type: integer, minimum: 1 }
            archivedAt: { type: string, format: date-time }
            referenceCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            message: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    LegalEntityAddress:
      type: object
      additionalProperties: false
